name: Tamkeen Admin validation
on:
  push:
    branches: ["feature/tamkeen-admin-live-edit-20261029"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tamkeen_test
          POSTGRES_USER: tamkeen_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamkeen_test -d tamkeen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TAMKEEN_TEST_DATABASE_URL: postgresql://tamkeen_test:test-only-password@127.0.0.1:5432/tamkeen_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
